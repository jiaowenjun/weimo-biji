[workspace]
resolver = "2"
members = ["backend"]

[workspace.package]
version = "0.2.3"
edition = "2024"
authors = ["Weimo <weimo@weimo.cc>"]
license = "MIT"
repository = "https://github.com/weimo/weimo"
homepage = "https://weimo.cc"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json", "multipart"] }
base64 = "0.22.1"
bcrypt = "0.18.0"
clap = { version = "4.5.54", features = ["derive", "env"] }
http = "1.4.0"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
noyalib = { version = "=0.0.15", default-features = false, features = ["std", "fast-int", "fast-float"] }
reqwest = { version = "0.13.1", features = ["blocking", "cookies", "json", "multipart", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shellexpand = "3.1.1"
tempfile = "3.24.0"
thiserror = "2.0.18"
time = { version = "0.3.45", features = ["local-offset", "serde-well-known"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.6.8", features = ["cors"] }
tower = "0.5.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
tagtree = "0.3"
